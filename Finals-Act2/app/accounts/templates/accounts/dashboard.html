{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | JNL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="side">
      <div class="logo">JNL</div>
      <nav class="nav">
        <a href="{% url 'dashboard' %}" class="nav__link is-active">Dashboard</a>
      </nav>
      <form method="post" action="{% url 'logout_user' %}" class="side__logout">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="top">
        <div>
          <h1>Hello, {{ request.user.first_name|default:request.user.username }}</h1>
          <p class="muted">What is going on today?</p>
        </div>
        <div class="avatar">{{ request.user.first_name|default:request.user.username|slice:":1"|upper }}</div>
      </header>
    </main>

  </div>
</body>
</html>
